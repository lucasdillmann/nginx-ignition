sonar.organization=lucasdillmann
sonar.projectKey=lucasdillmann_nginx-ignition
sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.exclusions=\
  **/node_modules/**, \
  **/vendor/**, \
  **/.go/pkg/**, \
  **/*_test.go
sonar.coverage.exclusions=\
  **/*.mock.go, \
  **/*.generated.go, \
  **/*_test.go, \
  internal/database/core/migrations/**, \
  frontend/**
sonar.go.coverage.reportPaths=coverage.out
sonar.cpd.exclusions=\
  internal/database/core/migrations/**, \
  internal/certificate/domain/letsencrypt/dns/**, \
  internal/vpn/**, \
  internal/api/**, \
  **/*_test.go
sonar.issue.ignore.multicriteria=capture-await-loop,capture-process-paths,capture-demo-addresses
sonar.issue.ignore.multicriteria.capture-await-loop.ruleKey=javascript:S9382
sonar.issue.ignore.multicriteria.capture-await-loop.resourceKey=tools/capture/**
sonar.issue.ignore.multicriteria.capture-process-paths.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.capture-process-paths.resourceKey=tools/capture/**
sonar.issue.ignore.multicriteria.capture-demo-addresses.ruleKey=javascript:S1313
sonar.issue.ignore.multicriteria.capture-demo-addresses.resourceKey=tools/capture/**
