name: release-pipeline
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: nginx-ignition-image-build
      cancel-in-progress: false
    env:
      BUILDKIT_PROGRESS: plain
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
            tools/i18n/go.sum
      - name: Install dependencies
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt update
          sudo apt install -y nfpm gettext-base nsis
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build binaries
        run: make .backend-build VERSION=${VERSION}
      - name: Build non-Windows distribution files
        run: make .build-distribution-non-windows VERSION=${VERSION}
      - name: Build and push Docker image
        run: make .build-release-docker-image VERSION=${VERSION}
      - name: Stage raw Windows binaries
        run: |
          mkdir -p signpath/raw
          cp build/windows/amd64.exe signpath/raw/nginx-ignition-windows-amd64.exe
          cp build/windows/arm64.exe signpath/raw/nginx-ignition-windows-arm64.exe
          (cd signpath/raw && zip -q -r ../raw.zip .)
      - name: Upload raw Windows binaries
        id: upload-raw
        uses: actions/upload-artifact@v7
        with:
          name: windows-raw-unsigned
          path: signpath/raw.zip
          archive: false
          if-no-files-found: error
      - name: Sign raw Windows binaries
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-raw.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          skip-decompress: true
          output-artifact-directory: signpath/raw-signed
          parameters: |
            version: ${{ toJSON(github.ref_name) }}
      - name: Restore signed raw Windows binaries
        run: |
          cp signpath/raw-signed/nginx-ignition-windows-amd64.exe build/windows/amd64.exe
          cp signpath/raw-signed/nginx-ignition-windows-arm64.exe build/windows/arm64.exe
      - name: Build Windows distribution files
        run: make .build-distribution-windows VERSION=${VERSION}
      - name: Stage Windows installers
        run: |
          mkdir -p signpath/installers
          cp "build/nginx-ignition-${VERSION}.windows-amd64-setup.exe" signpath/installers/nginx-ignition-windows-amd64-setup.exe
          cp "build/nginx-ignition-${VERSION}.windows-arm64-setup.exe" signpath/installers/nginx-ignition-windows-arm64-setup.exe
          (cd signpath/installers && zip -q -r ../installers.zip .)
      - name: Upload Windows installers
        id: upload-installers
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers-unsigned
          path: signpath/installers.zip
          archive: false
          if-no-files-found: error
      - name: Sign Windows installers
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          skip-decompress: true
          output-artifact-directory: signpath/installers-signed
          parameters: |
            version: ${{ toJSON(github.ref_name) }}
      - name: Restore signed Windows installers
        run: |
          cp signpath/installers-signed/nginx-ignition-windows-amd64-setup.exe "build/nginx-ignition-${VERSION}.windows-amd64-setup.exe"
          cp signpath/installers-signed/nginx-ignition-windows-arm64-setup.exe "build/nginx-ignition-${VERSION}.windows-arm64-setup.exe"
      - name: Resolve Docker image hash
        id: docker
        run: |
          RAW_DIGEST=$(docker buildx imagetools inspect dillmann/nginx-ignition:${VERSION} --format '{{json .}}' | jq -r '.manifest.manifests[0].digest')
          echo "DOCKER_IMAGE_HASH=$(echo $RAW_DIGEST | sed 's/:/-/g')" >> $GITHUB_OUTPUT
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/scripts/update-release.sh "${{ steps.docker.outputs.DOCKER_IMAGE_HASH }}" "false" "${VERSION}" "true"
      - name: Upload distribution files
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            build/nginx-ignition*.zip
            build/nginx-ignition*.exe
            build/nginx-ignition*.deb
            build/nginx-ignition*.rpm
            build/nginx-ignition*.apk
            build/nginx-ignition*.pkg.tar.zst
            build/nginx-ignition*.ipk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/scripts/update-release.sh "${{ steps.docker.outputs.DOCKER_IMAGE_HASH }}" "false" "${VERSION}" "false"
